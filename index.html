<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BUSCAR LUGAR</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
    --accent: #1b6ef3;
    --accent-dark: #1557b0;
    --accent-soft: #e8f0fe;
    --surface: #ffffff;
    --surface-alt: #f4f6fb;
    --outline: #e5e7eb;
    --texto: #1f2937;
    --texto-sec: #6b7280;
    --error: #e53935;
    --on-accent: #ffffff;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--surface-alt);
    color: var(--texto);
    text-transform: uppercase;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}
.panel {
    flex: none;
    background: var(--surface);
    padding: 12px;
    border-bottom: 1px solid var(--outline);
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.btn-buscar {
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--on-accent);
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    padding: 14px 12px;
    cursor: pointer;
    touch-action: manipulation;
}
.btn-buscar:active { background: var(--accent-dark); }
.btn-buscar:focus-visible, .btn-sec:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
.btn-buscar[disabled] { opacity: .7; }
.resultado {
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.3;
    padding: 8px 10px;
    border-radius: 10px;
    background: var(--surface-alt);
    color: var(--texto-sec);
}
.resultado.ok { background: var(--accent-soft); color: var(--accent-dark); }
.resultado.error { color: var(--error); }
#detalle {
    font-size: 11px;
    font-weight: 600;
    color: var(--texto-sec);
    text-align: center;
    line-height: 1.4;
    word-break: break-word;
}

.fila { display: flex; gap: 8px; }
.btn-sec {
    flex: 1;
    border: 1px solid var(--outline);
    border-radius: 10px;
    background: var(--surface);
    color: var(--accent-dark);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 11px 8px;
    cursor: pointer;
    touch-action: manipulation;
}
#mapaCaja { flex: 1 0 340px; position: relative; background: #e5e7eb; display: none; }
#mapaCaja.abierto { display: block; }
#mapa { position: absolute; inset: 0; }
#etiqueta {
    position: absolute;
    left: 8px; bottom: 8px;
    z-index: 500;
    background: rgba(255,255,255,.92);
    color: var(--texto);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 6px;
    display: none;
    pointer-events: none;
}
#ayuda {
    position: absolute;
    top: 8px; left: 50%;
    transform: translateX(-50%);
    z-index: 500;
    background: rgba(255,255,255,.92);
    color: var(--texto);
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 6px;
    white-space: nowrap;
    pointer-events: none;
}
@media (prefers-color-scheme: dark) {
    :root {
        --accent: #4d8dff;
        --accent-dark: #8fb6ff;
        --accent-soft: #1a2b4a;
        --surface: #181b22;
        --surface-alt: #0f1115;
        --outline: #2a2f3a;
        --texto: #e5e7eb;
        --texto-sec: #9ca3af;
        --on-accent: #0f1115;
    }
    .btn-buscar:active { background: #8fb6ff; }
    #etiqueta, #ayuda { background: rgba(24,27,34,.92); }
    #mapaCaja { background: #1f232c; }
}
</style>
</head>
<body>

<div class="panel">
    <button id="btnBuscar" class="btn-buscar" type="button">📍 BUSCAR LUGAR</button>
    <div id="resultado" class="resultado" role="status" aria-live="polite">SIN LUGAR</div>
    <div id="detalle" hidden></div>
    <div class="fila">
        <button id="btnMapa" class="btn-sec" type="button" aria-expanded="false">▼ DESPLEGAR MAPA</button>
        <button id="btnQuitar" class="btn-sec" type="button" hidden>✕ QUITAR PUNTO (USAR GPS)</button>
    </div>
</div>

<div id="mapaCaja">
    <div id="mapa"></div>
    <div id="ayuda">TOCA EL MAPA PARA PONER UN PUNTO</div>
    <div id="etiqueta"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/*PURO-INICIO*/
/* ===== Números de avenida / calle =====
   Acepta cifras ("AVENIDA 2", "CALLE 7") y palabras ("AVENIDA SEGUNDA", "CALLE CENTRAL").
   Un nombre sin número (por ejemplo "CALLE BLANCOS" o "PASEO COLÓN") no cuenta. */
const ORDINALES = {
    central: 0, cero: 0,
    primera: 1, primero: 1, segunda: 2, segundo: 2, tercera: 3, tercero: 3,
    cuarta: 4, cuarto: 4, quinta: 5, quinto: 5, sexta: 6, sexto: 6,
    septima: 7, septimo: 7, octava: 8, octavo: 8, novena: 9, noveno: 9,
    decima: 10, decimo: 10, undecima: 11, undecimo: 11, duodecima: 12, duodecimo: 12
};
const sinTildes = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

function numeroDe(nombre, tipo) {
    const n = sinTildes(nombre);
    const pal = tipo === "avenida" ? "(?:avenida|av\\.?)" : "calle";
    const cifra = n.match(new RegExp("\\b" + pal + "\\s*(\\d+)\\b"));
    if (cifra) return Number(cifra[1]);
    const palabra = n.match(new RegExp("\\b" + pal + "\\s+([a-z]+)\\b"));
    if (palabra && Object.prototype.hasOwnProperty.call(ORDINALES, palabra[1])) return ORDINALES[palabra[1]];
    return null;
}

/* ===== Búsqueda local con el trazado real de cada calle =====
   vias: [{ t: "a" | "c", n: número, p: [lat, lon, lat, lon, ...] }]
   Se mide la distancia exacta del punto a cada tramo y se elige la avenida y la calle más cercanas. */
const MAX_DIST = 250;   // metros
function distanciaAVia(p, lat, lon) {
    const kLat = 111320, kLon = 111320 * Math.cos(lat * Math.PI / 180);
    let min = Infinity;
    for (let i = 0; i + 3 < p.length; i += 2) {
        const ax = (p[i + 1] - lon) * kLon, ay = (p[i] - lat) * kLat;
        const bx = (p[i + 3] - lon) * kLon, by = (p[i + 2] - lat) * kLat;
        const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
        const t = l2 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / l2)) : 0;
        min = Math.min(min, Math.hypot(ax + t * dx, ay + t * dy));
    }
    if (p.length === 2) min = Math.hypot((p[1] - lon) * kLon, (p[0] - lat) * kLat);
    return min;
}
function elegirVias(vias, lat, lon) {
    const mejor = { a: null, c: null };
    vias.forEach(v => {
        const d = distanciaAVia(v.p, lat, lon);
        if (d <= MAX_DIST && (!mejor[v.t] || d < mejor[v.t].d)) mejor[v.t] = { n: v.n, d };
    });
    return { avenida: mejor.a, calle: mejor.c };
}
function textoLugar(r) {
    if (r.avenida && r.calle) return `AVENIDA ${r.avenida.n} CALLE ${r.calle.n}`;
    if (r.avenida) return `AVENIDA ${r.avenida.n}`;
    if (r.calle) return `CALLE ${r.calle.n}`;
    return "";
}

/* Convierte la respuesta de Overpass en vías con número (las demás se descartan) */
function parsearVias(elementos) {
    const r5 = x => Math.round(x * 1e5) / 1e5;
    const vias = [];
    (elementos || []).forEach(v => {
        const nombre = v.tags && v.tags.name;
        if (!nombre || !Array.isArray(v.geometry) || !v.geometry.length) return;
        const na = numeroDe(nombre, "avenida"), nc = numeroDe(nombre, "calle");
        const tipo = na !== null ? "a" : (nc !== null ? "c" : null);
        if (!tipo) return;
        const p = [];
        v.geometry.forEach(g => { if (g && typeof g.lat === "number" && typeof g.lon === "number") p.push(r5(g.lat), r5(g.lon)); });
        if (p.length >= 2) vias.push({ t: tipo, n: tipo === "a" ? na : nc, p });
    });
    return vias;
}
/*PURO-FIN*/

/* ===================== MAPA PLEGABLE + PUNTO MANUAL ===================== */
const caja = document.getElementById("mapaCaja");
const btnMapa = document.getElementById("btnMapa");
const btnQuitar = document.getElementById("btnQuitar");
const btnBuscar = document.getElementById("btnBuscar");
const resultado = document.getElementById("resultado");
const detalle = document.getElementById("detalle");
const ayuda = document.getElementById("ayuda");
const etiqueta = document.getElementById("etiqueta");

let mapa = null, capa = null;
let punto = null;          // punto que se ve en el mapa { lat, lon, prec, manual }
let manualPunto = null;    // si existe, la búsqueda usa este punto en vez del GPS
const CENTRO_DEFECTO = [9.9328, -84.0795];   // San José centro, solo para abrir el mapa sin punto

function asegurarMapa() {
    if (mapa || !window.L) return;
    mapa = L.map("mapa", { zoomControl: false, attributionControl: true });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OSM" }).addTo(mapa);
    mapa.setView(CENTRO_DEFECTO, 16);
    mapa.on("click", e => ponerPuntoManual(e.latlng.lat, e.latlng.lng));
}

function dibujarMapa(recentrar) {
    if (!caja.classList.contains("abierto")) return;   // replegado: se dibuja al desplegar
    asegurarMapa();
    if (!mapa) return;
    if (capa) { capa.remove(); capa = null; }
    if (punto) {
        capa = L.layerGroup().addTo(mapa);
        if (punto.prec && punto.prec > 5) {
            L.circle([punto.lat, punto.lon], { radius: Math.min(punto.prec, 200), color: "#1b6ef3", weight: 1, fillOpacity: 0.12 }).addTo(capa);
        }
        L.circleMarker([punto.lat, punto.lon], { radius: 8, color: "#fff", weight: 3, fillColor: "#e53935", fillOpacity: 1 }).addTo(capa);
        if (recentrar) mapa.setView([punto.lat, punto.lon], 17);
        etiqueta.textContent = punto.manual
            ? "PUNTO MANUAL · " + punto.lat.toFixed(5) + ", " + punto.lon.toFixed(5)
            : "GPS ±" + Math.round(punto.prec || 0) + " M";
        etiqueta.style.display = "block";
        ayuda.style.display = "none";
    } else {
        etiqueta.style.display = "none";
        ayuda.style.display = "block";
    }
    setTimeout(() => {
        mapa.invalidateSize();
        if (recentrar && punto) mapa.setView([punto.lat, punto.lon], 17);
    }, 120);
}

btnMapa.addEventListener("click", () => {
    const abrir = !caja.classList.contains("abierto");
    caja.classList.toggle("abierto", abrir);
    btnMapa.setAttribute("aria-expanded", abrir ? "true" : "false");
    btnMapa.textContent = abrir ? "▲ REPLEGAR MAPA" : "▼ DESPLEGAR MAPA";
    if (abrir) {
        dibujarMapa(true);
        setTimeout(() => caja.scrollIntoView({ behavior: "smooth", block: "nearest" }), 150);
    }
});

// Toque en el mapa: fija el punto de prueba y busca automáticamente
function ponerPuntoManual(lat, lon) {
    manualPunto = { lat, lon };
    punto = { lat, lon, prec: 0, manual: true };
    btnQuitar.hidden = false;
    dibujarMapa(false);
    buscar();
}

btnQuitar.addEventListener("click", () => {
    manualPunto = null;
    punto = null;
    btnQuitar.hidden = true;
    dibujarMapa(false);
});

/* ===================== CALLES DE LA ZONA: se descargan una vez y se guardan ===================== */
const SERVIDORES = [
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter",
    "https://overpass.private.coffee/api/interpreter",
    "https://overpass.openstreetmap.fr/api/interpreter",
    "https://maps.mail.ru/osm/tools/overpass/api/interpreter"
];
const CELDA = 0.02;      // grados por zona (≈ 2.2 km)
const MARGEN = 0.004;    // grados extra alrededor (≈ 450 m) para no perder calles en el borde
const PREF = "buscarlugar_zona_v1_";
const memoria = {}, enVuelo = {};

function claveZona(lat, lon) { return Math.floor(lat / CELDA) + "_" + Math.floor(lon / CELDA); }

function leerCache(clave) {
    if (memoria[clave]) return memoria[clave];
    try {
        const s = localStorage.getItem(PREF + clave);
        if (s) {
            const o = JSON.parse(s);
            if (Date.now() - o.t < 30 * 864e5) { memoria[clave] = o.v; return o.v; }   // 30 días
        }
    } catch (e) { /* sin almacenamiento: queda solo en memoria */ }
    return null;
}
function guardarCache(clave, vias) {
    memoria[clave] = vias;
    const guardar = () => localStorage.setItem(PREF + clave, JSON.stringify({ t: Date.now(), v: vias }));
    try { guardar(); } catch (e) {
        try {   // si no cabe, se borran las zonas guardadas antes
            Object.keys(localStorage).filter(k => k.startsWith(PREF)).forEach(k => localStorage.removeItem(k));
            guardar();
        } catch (e2) { /* solo memoria */ }
    }
}

// Consulta los servidores a la vez; gana el primero que responda bien. Si todos fallan, explica por qué.
function overpass(consulta, ms) {
    const ctrls = [];
    const pedir = (url) => {
        const host = new URL(url).host;
        const c = new AbortController();
        ctrls.push(c);
        const t = setTimeout(() => c.abort(), ms);
        return fetch(url + "?data=" + encodeURIComponent(consulta), { signal: c.signal })
            .then(async r => {
                clearTimeout(t);
                if (!r.ok) throw new Error(host + ": HTTP " + r.status);
                const d = await r.json();
                if (!d || !Array.isArray(d.elements)) throw new Error(host + ": RESPUESTA VACÍA");
                if (d.remark && /error|timed out|out of memory/i.test(d.remark)) throw new Error(host + ": SERVIDOR SATURADO");
                return d;
            })
            .catch(e => {
                clearTimeout(t);
                if (e.message && e.message.startsWith(host)) throw e;
                throw new Error(host + ": " + (e.name === "AbortError" ? "TIEMPO AGOTADO" : "SIN RESPUESTA"));
            });
    };
    return Promise.any(SERVIDORES.map(pedir)).then(d => { ctrls.forEach(c => c.abort()); return d; });
}

async function descargarZona(clave, lat, lon, avisar) {
    const ty = Math.floor(lat / CELDA), tx = Math.floor(lon / CELDA);
    const r5 = x => Math.round(x * 1e5) / 1e5;
    const s = r5(ty * CELDA - MARGEN), w = r5(tx * CELDA - MARGEN), n = r5((ty + 1) * CELDA + MARGEN), e = r5((tx + 1) * CELDA + MARGEN);
    const consulta = `[out:json][timeout:40];way["highway"]["name"~"^(avenida|av|calle)[. ]",i](${s},${w},${n},${e});out geom;`;
    let ultimoError = null;
    for (let intento = 1; intento <= 3; intento++) {
        avisar(`DESCARGANDO CALLES DE LA ZONA… (${intento}/3)`);
        try {
            const d = await overpass(consulta, 30000);
            const vias = parsearVias(d.elements);
            guardarCache(clave, vias);
            return vias;
        } catch (err) {
            ultimoError = err;
            await new Promise(ok => setTimeout(ok, 1500));
        }
    }
    const lista = ultimoError && ultimoError.errors ? ultimoError.errors.map(x => x.message) : [String(ultimoError && ultimoError.message)];
    const falla = new Error("DESCARGA");
    falla.detalle = lista.join(" · ");
    throw falla;
}

// Una sola descarga por zona aunque se toque varias veces mientras baja
function obtenerVias(lat, lon, avisar) {
    const clave = claveZona(lat, lon);
    const guardadas = leerCache(clave);
    if (guardadas) return Promise.resolve(guardadas);
    if (!enVuelo[clave]) {
        enVuelo[clave] = descargarZona(clave, lat, lon, avisar).finally(() => { delete enVuelo[clave]; });
    }
    return enVuelo[clave];
}

/* ===================== BÚSQUEDA ===================== */
let token = 0, fin = 0;
function mostrar(txt, clase) { resultado.textContent = txt; resultado.className = "resultado" + (clase ? " " + clase : ""); }
function mostrarDetalle(txt) { detalle.textContent = txt || ""; detalle.hidden = !txt; }
function fallar(msg, det) { mostrar(msg, "error"); mostrarDetalle(det); btnBuscar.disabled = false; }

async function buscarLugar(lat, lon, tk) {
    let vias;
    try {
        vias = await obtenerVias(lat, lon, txt => { if (tk === token) mostrar(txt); });
    } catch (err) {
        if (tk !== token) return;
        fallar("NO SE PUDIERON DESCARGAR LAS CALLES", err.detalle ? "MOTIVO: " + err.detalle + " · TOCA BUSCAR PARA REINTENTAR" : "");
        return;
    }
    if (tk !== token) return;

    const r = elegirVias(vias, lat, lon);
    const txt = textoLugar(r);
    if (txt) {
        mostrar(txt, "ok");
        mostrarDetalle([r.avenida && "AVENIDA A " + Math.round(r.avenida.d) + " M", r.calle && "CALLE A " + Math.round(r.calle.d) + " M"].filter(Boolean).join(" · "));
    } else {
        // Sin número cerca: no se muestra ningún nombre, solo queda el punto
        mostrar("SIN NÚMERO · SOLO EL PUNTO", "error");
        mostrarDetalle("NO HAY AVENIDA NI CALLE NUMERADA A MENOS DE " + MAX_DIST + " M · " + vias.length + " VÍAS EN LA ZONA");
    }
    btnBuscar.disabled = false;
}

/* ===================== PUNTO: GPS o punto manual ===================== */
function buscar() {
    const tk = ++token;
    fin = Date.now() + 15000;
    btnBuscar.disabled = true;
    mostrar("BUSCANDO LUGAR…");
    mostrarDetalle("");

    // Con punto manual no se usa el GPS
    if (manualPunto) { buscarLugar(manualPunto.lat, manualPunto.lon, tk); return; }

    if (!navigator.geolocation) { fallar("GPS NO DISPONIBLE"); return; }
    const vigente = () => tk === token;
    const pedir = () => navigator.geolocation.getCurrentPosition(pos => {
        if (!vigente()) return;
        const { latitude: lat, longitude: lon, accuracy } = pos.coords;
        punto = { lat, lon, prec: accuracy, manual: false };
        dibujarMapa(true);
        buscarLugar(lat, lon, tk);
    }, err => {
        if (!vigente()) return;
        if ((err && err.code === 1) || Date.now() > fin) fallar("NO SE LOGRA UBICAR");
        else setTimeout(() => { if (vigente()) pedir(); }, 1500);
    }, { enableHighAccuracy: true, maximumAge: 15000, timeout: 10000 });
    pedir();
}

btnBuscar.addEventListener("click", buscar);
</script>
</body>
</html>
