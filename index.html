<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BUSCAR LUGAR</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
    --accent: #1b6ef3;
    --accent-dark: #1557b0;
    --accent-soft: #e8f0fe;
    --surface: #ffffff;
    --surface-alt: #f4f6fb;
    --outline: #e5e7eb;
    --texto: #1f2937;
    --texto-sec: #6b7280;
    --error: #e53935;
    --on-accent: #ffffff;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--surface-alt);
    color: var(--texto);
    text-transform: uppercase;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}
.panel {
    flex: none;
    background: var(--surface);
    padding: 12px;
    border-bottom: 1px solid var(--outline);
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.btn-buscar {
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--on-accent);
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    padding: 14px 12px;
    cursor: pointer;
    touch-action: manipulation;
}
.btn-buscar:active { background: var(--accent-dark); }
.btn-buscar:focus-visible, .btn-sec:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
.btn-buscar[disabled] { opacity: .7; }
.resultado {
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.3;
    padding: 8px 10px;
    border-radius: 10px;
    background: var(--surface-alt);
    color: var(--texto-sec);
}
.resultado.ok { background: var(--accent-soft); color: var(--accent-dark); }
.resultado.error { color: var(--error); }

.fila { display: flex; gap: 8px; }
.btn-sec {
    flex: 1;
    border: 1px solid var(--outline);
    border-radius: 10px;
    background: var(--surface);
    color: var(--accent-dark);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 11px 8px;
    cursor: pointer;
    touch-action: manipulation;
}
#mapaCaja { flex: 1 0 340px; position: relative; background: #e5e7eb; display: none; }
#mapaCaja.abierto { display: block; }
#mapa { position: absolute; inset: 0; }
#etiqueta {
    position: absolute;
    left: 8px; bottom: 8px;
    z-index: 500;
    background: rgba(255,255,255,.92);
    color: var(--texto);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 6px;
    display: none;
    pointer-events: none;
}
#ayuda {
    position: absolute;
    top: 8px; left: 50%;
    transform: translateX(-50%);
    z-index: 500;
    background: rgba(255,255,255,.92);
    color: var(--texto);
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 6px;
    white-space: nowrap;
    pointer-events: none;
}
@media (prefers-color-scheme: dark) {
    :root {
        --accent: #4d8dff;
        --accent-dark: #8fb6ff;
        --accent-soft: #1a2b4a;
        --surface: #181b22;
        --surface-alt: #0f1115;
        --outline: #2a2f3a;
        --texto: #e5e7eb;
        --texto-sec: #9ca3af;
        --on-accent: #0f1115;
    }
    .btn-buscar:active { background: #8fb6ff; }
    #etiqueta, #ayuda { background: rgba(24,27,34,.92); }
    #mapaCaja { background: #1f232c; }
}
</style>
</head>
<body>

<div class="panel">
    <button id="btnBuscar" class="btn-buscar" type="button">📍 BUSCAR LUGAR</button>
    <div id="resultado" class="resultado" role="status" aria-live="polite">SIN LUGAR</div>
    <div class="fila">
        <button id="btnMapa" class="btn-sec" type="button" aria-expanded="false">▼ DESPLEGAR MAPA</button>
        <button id="btnQuitar" class="btn-sec" type="button" hidden>✕ QUITAR PUNTO (USAR GPS)</button>
    </div>
</div>

<div id="mapaCaja">
    <div id="mapa"></div>
    <div id="ayuda">TOCA EL MAPA PARA PONER UN PUNTO</div>
    <div id="etiqueta"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/*PURO-INICIO*/
/* ===== Números de avenida / calle =====
   Acepta cifras ("AVENIDA 2", "CALLE 7") y palabras ("AVENIDA SEGUNDA", "CALLE CENTRAL").
   Un nombre sin número (por ejemplo "CALLE BLANCOS" o "PASEO COLÓN") no cuenta. */
const ORDINALES = {
    central: 0, cero: 0,
    primera: 1, primero: 1, segunda: 2, segundo: 2, tercera: 3, tercero: 3,
    cuarta: 4, cuarto: 4, quinta: 5, quinto: 5, sexta: 6, sexto: 6,
    septima: 7, septimo: 7, octava: 8, octavo: 8, novena: 9, noveno: 9,
    decima: 10, decimo: 10, undecima: 11, undecimo: 11, duodecima: 12, duodecimo: 12
};
const sinTildes = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

function numeroDe(nombre, tipo) {
    const n = sinTildes(nombre);
    const pal = tipo === "avenida" ? "(?:avenida|av\\.?)" : "calle";
    const cifra = n.match(new RegExp("\\b" + pal + "\\s*(\\d+)\\b"));
    if (cifra) return Number(cifra[1]);
    const palabra = n.match(new RegExp("\\b" + pal + "\\s+([a-z]+)\\b"));
    if (palabra && Object.prototype.hasOwnProperty.call(ORDINALES, palabra[1])) return ORDINALES[palabra[1]];
    return null;
}

/* ===== Elige la avenida y la calle donde está el punto =====
   Photon da un solo punto por cada vía, y ese punto puede quedar lejos a lo largo de la calle.
   Por eso no se mide la distancia directa: las avenidas van de este a oeste, así que su distancia
   al punto es la diferencia de LATITUD; las calles van de norte a sur, así que su distancia es la
   diferencia de LONGITUD. Se elige la de menor distancia, hasta MAX_DIST metros. */
const MAX_DIST = 500;
function elegir(pool, lat, lon) {
    const kLat = 111320, kLon = 111320 * Math.cos(lat * Math.PI / 180);
    const av = {}, ca = {};
    pool.forEach(e => {
        const na = numeroDe(e.nombre, "avenida");
        if (na !== null) { const d = Math.abs(e.lat - lat) * kLat; if (!(na in av) || d < av[na]) av[na] = d; }
        const nc = numeroDe(e.nombre, "calle");
        if (nc !== null) { const d = Math.abs(e.lon - lon) * kLon; if (!(nc in ca) || d < ca[nc]) ca[nc] = d; }
    });
    const mejor = obj => {
        let k = null;
        Object.keys(obj).forEach(n => { if (obj[n] <= MAX_DIST && (k === null || obj[n] < obj[k])) k = n; });
        return k === null ? null : Number(k);
    };
    return { avenida: mejor(av), calle: mejor(ca) };
}

function textoLugar(r) {
    if (r.avenida !== null && r.calle !== null) return `AVENIDA ${r.avenida} CALLE ${r.calle}`;
    if (r.avenida !== null) return `AVENIDA ${r.avenida}`;
    if (r.calle !== null) return `CALLE ${r.calle}`;
    return "";
}
/*PURO-FIN*/

/* ===================== MAPA PLEGABLE + PUNTO MANUAL ===================== */
const caja = document.getElementById("mapaCaja");
const btnMapa = document.getElementById("btnMapa");
const btnQuitar = document.getElementById("btnQuitar");
const btnBuscar = document.getElementById("btnBuscar");
const resultado = document.getElementById("resultado");
const ayuda = document.getElementById("ayuda");
const etiqueta = document.getElementById("etiqueta");

let mapa = null, capa = null;
let punto = null;          // punto que se ve en el mapa { lat, lon, prec, manual }
let manualPunto = null;    // si existe, la búsqueda usa este punto en vez del GPS
const CENTRO_DEFECTO = [9.9328, -84.0795];   // San José centro, solo para abrir el mapa sin punto

function asegurarMapa() {
    if (mapa || !window.L) return;
    mapa = L.map("mapa", { zoomControl: false, attributionControl: true });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OSM" }).addTo(mapa);
    mapa.setView(CENTRO_DEFECTO, 16);
    mapa.on("click", e => ponerPuntoManual(e.latlng.lat, e.latlng.lng));
}

function dibujarMapa(recentrar) {
    if (!caja.classList.contains("abierto")) return;   // replegado: se dibuja al desplegar
    asegurarMapa();
    if (!mapa) return;
    if (capa) { capa.remove(); capa = null; }
    if (punto) {
        capa = L.layerGroup().addTo(mapa);
        if (punto.prec && punto.prec > 5) {
            L.circle([punto.lat, punto.lon], { radius: Math.min(punto.prec, 200), color: "#1b6ef3", weight: 1, fillOpacity: 0.12 }).addTo(capa);
        }
        L.circleMarker([punto.lat, punto.lon], { radius: 8, color: "#fff", weight: 3, fillColor: "#e53935", fillOpacity: 1 }).addTo(capa);
        if (recentrar) mapa.setView([punto.lat, punto.lon], 17);
        etiqueta.textContent = punto.manual
            ? "PUNTO MANUAL · " + punto.lat.toFixed(5) + ", " + punto.lon.toFixed(5)
            : "GPS ±" + Math.round(punto.prec || 0) + " M";
        etiqueta.style.display = "block";
        ayuda.style.display = "none";
    } else {
        etiqueta.style.display = "none";
        ayuda.style.display = "block";
    }
    setTimeout(() => {
        mapa.invalidateSize();
        if (recentrar && punto) mapa.setView([punto.lat, punto.lon], 17);
    }, 120);
}

btnMapa.addEventListener("click", () => {
    const abrir = !caja.classList.contains("abierto");
    caja.classList.toggle("abierto", abrir);
    btnMapa.setAttribute("aria-expanded", abrir ? "true" : "false");
    btnMapa.textContent = abrir ? "▲ REPLEGAR MAPA" : "▼ DESPLEGAR MAPA";
    if (abrir) {
        dibujarMapa(true);
        setTimeout(() => caja.scrollIntoView({ behavior: "smooth", block: "nearest" }), 150);
    }
});

// Toque en el mapa: fija el punto de prueba y busca automáticamente
function ponerPuntoManual(lat, lon) {
    manualPunto = { lat, lon };
    punto = { lat, lon, prec: 0, manual: true };
    btnQuitar.hidden = false;
    dibujarMapa(false);
    buscar();
}

btnQuitar.addEventListener("click", () => {
    manualPunto = null;
    punto = null;
    btnQuitar.hidden = true;
    dibujarMapa(false);
});

/* ===================== PHOTON ===================== */
let token = 0, fin = 0;
const esperar = ms => new Promise(ok => setTimeout(ok, ms));
function mostrar(txt, clase) { resultado.textContent = txt; resultado.className = "resultado" + (clase ? " " + clase : ""); }
function fallar(msg) { mostrar(msg, "error"); btnBuscar.disabled = false; }

// Una consulta a Photon: devuelve las vías cercanas con su nombre y coordenadas.
// Vías: su nombre. Otros objetos (casas, comercios): la calle de su dirección.
async function photonVias(lat, lon, radioKm) {
    const url = `https://photon.komoot.io/reverse?lat=${lat}&lon=${lon}&radius=${radioKm}&limit=50&osm_tag=highway`;
    const r = await fetch(url, { signal: AbortSignal.timeout(5000) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const lista = [];
    (d.features || []).forEach(f => {
        const p = f.properties || {};
        const c = (f.geometry && f.geometry.coordinates) || [];
        if (c.length < 2) return;
        const nombre = p.osm_key === "highway" ? p.name : p.street;
        if (nombre) lista.push({ nombre: String(nombre), lat: c[1], lon: c[0] });
    });
    return lista;
}

/* Búsqueda amplia en fases. En cada fase se consulta el punto y, si falta la avenida o la calle,
   también puntos desplazados en ambas direcciones: al norte y al sur (para las avenidas) y al este
   y al oeste (para las calles). Se detiene en cuanto aparecen las dos con número. */
const FASES = [
    { centro: 0.2, lado: 0,   radioLado: 0 },
    { centro: 0.5, lado: 400, radioLado: 0.3 },
    { centro: 1.0, lado: 800, radioLado: 0.5 }
];

async function buscarEnFases(lat, lon, tk) {
    const mLat = 1 / 111320, mLon = 1 / (111320 * Math.cos(lat * Math.PI / 180));
    const pool = [];
    let respuestas = 0, r = { avenida: null, calle: null };

    for (const f of FASES) {
        if (tk !== token) return null;
        const consultas = [photonVias(lat, lon, f.centro)];
        if (f.lado) {
            const aLat = lat + f.lado * mLat, bLat = lat - f.lado * mLat;
            const aLon = lon + f.lado * mLon, bLon = lon - f.lado * mLon;
            if (r.avenida === null) consultas.push(photonVias(aLat, lon, f.radioLado), photonVias(bLat, lon, f.radioLado));
            if (r.calle === null)   consultas.push(photonVias(lat, aLon, f.radioLado), photonVias(lat, bLon, f.radioLado));
        }
        const res = await Promise.allSettled(consultas);
        res.forEach(x => { if (x.status === "fulfilled") { respuestas++; pool.push(...x.value); } });
        r = elegir(pool, lat, lon);
        if (r.avenida !== null && r.calle !== null) break;
        mostrar("AMPLIANDO BÚSQUEDA…");
    }
    return respuestas ? r : undefined;   // undefined: ninguna consulta respondió
}

async function buscarPhoton(lat, lon, tk) {
    while (tk === token) {
        let r;
        try { r = await buscarEnFases(lat, lon, tk); } catch (e) { r = undefined; }
        if (tk !== token) return;
        if (r) {
            const txt = textoLugar(r);
            // Sin número (solo nombres o nada): no se muestra nombre, se deja el punto
            if (txt) mostrar(txt, "ok");
            else mostrar("SIN NÚMERO · SOLO EL PUNTO", "error");
            btnBuscar.disabled = false;
            return;
        }
        if (Date.now() > fin) { fallar("NO SE LOGRA UBICAR"); return; }
        await esperar(700);
    }
}

/* ===================== PUNTO: GPS o punto manual ===================== */
function buscar() {
    const tk = ++token;
    fin = Date.now() + 15000;
    btnBuscar.disabled = true;
    mostrar("BUSCANDO LUGAR…");

    // Con punto manual no se usa el GPS
    if (manualPunto) { buscarPhoton(manualPunto.lat, manualPunto.lon, tk); return; }

    if (!navigator.geolocation) { fallar("GPS NO DISPONIBLE"); return; }
    const vigente = () => tk === token;
    const pedir = () => navigator.geolocation.getCurrentPosition(pos => {
        if (!vigente()) return;
        const { latitude: lat, longitude: lon, accuracy } = pos.coords;
        punto = { lat, lon, prec: accuracy, manual: false };
        dibujarMapa(true);
        buscarPhoton(lat, lon, tk);
    }, err => {
        if (!vigente()) return;
        if ((err && err.code === 1) || Date.now() > fin) fallar("NO SE LOGRA UBICAR");
        else setTimeout(() => { if (vigente()) pedir(); }, 1500);
    }, { enableHighAccuracy: true, maximumAge: 15000, timeout: 10000 });
    pedir();
}

btnBuscar.addEventListener("click", buscar);
</script>
</body>
</html>
