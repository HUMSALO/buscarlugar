<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BUSCAR LUGAR</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
    --accent: #1b6ef3;
    --accent-dark: #1557b0;
    --accent-soft: #e8f0fe;
    --surface: #ffffff;
    --surface-alt: #f4f6fb;
    --outline: #e5e7eb;
    --texto: #1f2937;
    --texto-sec: #6b7280;
    --error: #e53935;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--surface-alt);
    color: var(--texto);
    text-transform: uppercase;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}
.panel {
    background: var(--surface);
    padding: 12px;
    border-bottom: 1px solid var(--outline);
    display: flex;
    flex-direction: column;
    gap: 10px;
}
#btnBuscar {
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .02em;
    padding: 14px 12px;
    cursor: pointer;
    touch-action: manipulation;
}
#btnBuscar:active { background: var(--accent-dark); }
#btnBuscar:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
#btnBuscar[disabled] { opacity: .7; }
#resultado {
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.3;
    padding: 8px 10px;
    border-radius: 10px;
    background: var(--surface-alt);
    color: var(--texto-sec);
}
#resultado.ok { background: var(--accent-soft); color: var(--accent-dark); }
#resultado.error { color: var(--error); }
#mapaCaja { flex: 1; position: relative; min-height: 0; background: #e5e7eb; }
#mapa { position: absolute; inset: 0; }
#precision {
    position: absolute;
    left: 8px; bottom: 8px;
    z-index: 500;
    background: rgba(255,255,255,.92);
    color: var(--texto);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 6px;
    display: none;
}
#vacio {
    position: absolute;
    inset: 0;
    z-index: 400;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--texto-sec);
    font-size: 13px;
    font-weight: 600;
    pointer-events: none;
}
@media (prefers-color-scheme: dark) {
    :root {
        --accent: #4d8dff;
        --accent-dark: #8fb6ff;
        --accent-soft: #1a2b4a;
        --surface: #181b22;
        --surface-alt: #0f1115;
        --outline: #2a2f3a;
        --texto: #e5e7eb;
        --texto-sec: #9ca3af;
    }
    #btnBuscar { color: #0f1115; }
    #btnBuscar:active { background: #8fb6ff; }
    #precision { background: rgba(24,27,34,.92); }
    #mapaCaja { background: #1f232c; }
}
</style>
</head>
<body>

<div class="panel">
    <button id="btnBuscar" type="button">📍 BUSCAR LUGAR</button>
    <div id="resultado" role="status" aria-live="polite">SIN LUGAR</div>
</div>

<div id="mapaCaja">
    <div id="mapa"></div>
    <div id="vacio">EL MAPA APARECE AL BUSCAR</div>
    <div id="precision"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===== Servidores Overpass: se consultan los tres a la vez y gana el primero que responda ===== */
const SERVIDORES = [
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter",
    "https://overpass.private.coffee/api/interpreter"
];

function consultarOverpass(consulta) {
    const ctrls = [];
    const pedir = (url) => {
        const c = new AbortController();
        ctrls.push(c);
        const t = setTimeout(() => c.abort(), 3500);
        return fetch(url + "?data=" + encodeURIComponent(consulta), { signal: c.signal })
            .then(r => { clearTimeout(t); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
            .catch(e => { clearTimeout(t); throw e; });
    };
    return Promise.any(SERVIDORES.map(pedir)).then(d => { ctrls.forEach(c => c.abort()); return d; });
}

/* ===== Elementos ===== */
const btn = document.getElementById("btnBuscar");
const resultado = document.getElementById("resultado");
const precisionEl = document.getElementById("precision");
const vacio = document.getElementById("vacio");

let mapa = null, capa = null;
let token = 0, finBusqueda = 0;

function mostrarTexto(txt, clase) {
    resultado.textContent = txt;
    resultado.className = clase || "";
}

/* ===== Mapa ===== */
function mostrarMapa(lat, lon, prec) {
    vacio.style.display = "none";
    if (!mapa) {
        mapa = L.map("mapa", { zoomControl: false, attributionControl: true });
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OSM" }).addTo(mapa);
    }
    if (capa) capa.remove();
    capa = L.layerGroup().addTo(mapa);
    if (prec && prec > 5) {
        L.circle([lat, lon], { radius: Math.min(prec, 200), color: "#1b6ef3", weight: 1, fillOpacity: 0.12 }).addTo(capa);
    }
    L.circleMarker([lat, lon], { radius: 8, color: "#fff", weight: 3, fillColor: "#e53935", fillOpacity: 1 }).addTo(capa);
    mapa.setView([lat, lon], 17);
    setTimeout(() => { mapa.invalidateSize(); mapa.setView([lat, lon], 17); }, 120);
    precisionEl.textContent = prec ? "PRECISIÓN ±" + Math.round(prec) + " M" : "";
    precisionEl.style.display = prec ? "block" : "none";
}

/* ===== Calcula avenida y calle más cercanas al punto GPS ===== */
function buscarLugar(lat, lon, intento, tk) {
    const vigente = () => tk === token;
    const reintentar = () => {
        if (!vigente()) return;
        if (Date.now() > finBusqueda) { fallar("NO SE LOGRA UBICAR"); return; }
        setTimeout(() => buscarLugar(lat, lon, intento + 1, tk), 500);
    };

    const consulta = `[out:json][timeout:8];(way(around:90,${lat},${lon})["highway"]["name"];);out geom;`;
    consultarOverpass(consulta).then(data => {
        const avDist = {}, caDist = {};
        // Distancia (m) del punto GPS a cada tramo de calle (plano local lat/lon -> metros)
        const kLat = 111320, kLon = 111320 * Math.cos(lat * Math.PI / 180);
        const distSegmento = (ax, ay, bx, by) => {
            const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
            const t = l2 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / l2)) : 0;
            return Math.hypot(ax + t * dx, ay + t * dy);
        };
        const distCalle = (geom) => {
            if (!Array.isArray(geom) || !geom.length) return 1e9;
            const pts = geom.filter(g => g && typeof g.lat === "number" && typeof g.lon === "number")
                            .map(g => ({ x: (g.lon - lon) * kLon, y: (g.lat - lat) * kLat }));
            if (!pts.length) return 1e9;
            if (pts.length === 1) return Math.hypot(pts[0].x, pts[0].y);
            let m = 1e9;
            for (let i = 0; i < pts.length - 1; i++) m = Math.min(m, distSegmento(pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y));
            return m;
        };
        // soloFaltantes: en la búsqueda ampliada solo se completa el tipo (avenida o calle) que no apareció
        const procesar = (elementos, soloFaltantes) => {
            const faltaAv = !Object.keys(avDist).length, faltaCa = !Object.keys(caDist).length;
            (elementos || []).forEach(v => {
                const nombre = (v.tags && v.tags.name) || "";
                if (!nombre) return;
                const d = distCalle(v.geometry);
                const av = nombre.match(/avenida\s*(\d+)/i);
                if (av && (!soloFaltantes || faltaAv) && !(av[1] in avDist && avDist[av[1]] <= d)) avDist[av[1]] = d;
                const ca = nombre.match(/calle\s*(\d+)/i);
                if (ca && (!soloFaltantes || faltaCa) && !(ca[1] in caDist && caDist[ca[1]] <= d)) caDist[ca[1]] = d;
            });
        };
        procesar(data.elements, false);

        const terminar = () => {
            if (!vigente()) return;
            // Las más cercanas primero; al mostrar se ordenan de menor a mayor
            const masCercanas = (obj, n) => Object.keys(obj).sort((a, b) => obj[a] - obj[b]).slice(0, n).sort((a, b) => a - b);
            const avenidas = masCercanas(avDist, 2), calles = masCercanas(caDist, 2);
            const avUna = masCercanas(avDist, 1)[0], caUna = masCercanas(caDist, 1)[0];
            const totAv = Object.keys(avDist).length, totCa = Object.keys(caDist).length;

            let txt = "";
            if (totAv >= 2 && totCa >= 1)      txt = `AVENIDA ${avenidas[0]} Y ${avenidas[1]} CALLE ${caUna}`;
            else if (totCa >= 2 && totAv >= 1) txt = `AVENIDA ${avUna} CALLE ${calles[0]} Y ${calles[1]}`;
            else if (totAv >= 1 && totCa >= 1) txt = `AVENIDA ${avUna} CALLE ${caUna}`;
            else if (totAv >= 1)               txt = `AVENIDA ${avUna}`;
            else if (totCa >= 1)               txt = `CALLE ${caUna}`;

            if (txt) {
                mostrarTexto(txt, "ok");
                btn.disabled = false;
            } else {
                reintentar();
            }
        };

        // Siempre avenida Y calle: si en 90 m falta alguna, se amplía a 150 m solo para completarla
        if (!Object.keys(avDist).length || !Object.keys(caDist).length) {
            consultarOverpass(`[out:json][timeout:8];(way(around:150,${lat},${lon})["highway"]["name"];);out geom;`)
                .then(d2 => procesar(d2.elements, true))
                .catch(() => {})
                .then(terminar);
        } else {
            terminar();
        }
    }).catch(() => reintentar());
}

function fallar(msg) {
    mostrarTexto(msg, "error");
    btn.disabled = false;
}

/* ===== Botón BUSCAR LUGAR ===== */
btn.addEventListener("click", () => {
    if (!navigator.geolocation) { fallar("GPS NO DISPONIBLE"); return; }

    const tk = ++token;
    finBusqueda = Date.now() + 12000;   // tope: si en 12 s no hay lugar, se detiene
    btn.disabled = true;
    mostrarTexto("BUSCANDO LUGAR…", "");

    const vigente = () => tk === token;
    const pedir = () => navigator.geolocation.getCurrentPosition(pos => {
        if (!vigente()) return;
        const { latitude: lat, longitude: lon, accuracy } = pos.coords;
        mostrarMapa(lat, lon, accuracy);
        buscarLugar(lat, lon, 0, tk);
    }, err => {
        if (!vigente()) return;
        if ((err && err.code === 1) || Date.now() > finBusqueda) {
            fallar("NO SE LOGRA UBICAR");   // permiso denegado o se acabó el tiempo
        } else {
            setTimeout(() => { if (vigente()) pedir(); }, 1500);
        }
    }, { enableHighAccuracy: true, maximumAge: 15000, timeout: 10000 });
    pedir();
});
</script>
</body>
</html>
